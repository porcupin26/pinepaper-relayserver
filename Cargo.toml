[package]
name = "pinepaper-exchange"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "An ephemeral WebSocket relay for PinePaper collaboration"
license = "MIT"
repository = "https://github.com/porcupin26/pinepaper-relayserver"

[dependencies]
axum = { version = "=0.8.9", features = ["ws"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
futures-util = { version = "0.3", features = ["sink"] }

[dev-dependencies]
tokio-tungstenite = "=0.30.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
